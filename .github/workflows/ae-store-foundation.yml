name: Validate ae.store foundation
on:
  pull_request:
    paths:
      - 'ae-store/**'
      - '.github/workflows/ae-store-foundation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate inactive proposal and policy bindings
        run: python3 -I -B ae-store/tools/validate.py
      - name: Exercise hostile and inconsistent inputs
        run: python3 -I -B -m unittest discover -s ae-store/tests -v
